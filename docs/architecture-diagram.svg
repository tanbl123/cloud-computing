<svg xmlns="http://www.w3.org/2000/svg" width="1460" height="1010" viewBox="0 0 1460 1010" font-family="Arial, Helvetica, sans-serif">
<defs>
  <marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#4A5568"/></marker>
  <marker id="ao" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#ED7100"/></marker>
  <marker id="ag" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#759C3E"/></marker>
</defs>
<rect width="1460" height="1010" fill="#ffffff"/>

<text x="30" y="34" font-size="19" font-weight="bold" fill="#16191F">Student Records Web Application — Target Architecture</text>
<text x="30" y="54" font-size="12" fill="#5A6570">BMIT3273 Cloud Computing · AWS Academy Lab Project: Cloud Web Application Builder</text>

<!-- users -->
<rect x="30" y="90" width="150" height="58" rx="5" fill="#fff" stroke="#4A5568" stroke-width="1.6"/>
<text x="105" y="114" font-size="13" font-weight="bold" text-anchor="middle" fill="#16191F">Internet users</text>
<text x="105" y="132" font-size="11" text-anchor="middle" fill="#5A6570">Admissions staff</text>

<!-- AWS cloud -->
<rect x="215" y="76" width="1215" height="900" rx="8" fill="#fff" stroke="#232F3E" stroke-width="2"/>
<text x="233" y="98" font-size="13" font-weight="bold" fill="#232F3E">AWS Cloud</text>
<rect x="215" y="112" width="1215" height="864" fill="none" stroke="#00A4A6" stroke-width="1.6" stroke-dasharray="7 4"/>
<text x="233" y="132" font-size="12" font-weight="bold" fill="#00A4A6">Region: us-east-1 (N. Virginia)</text>

<!-- regional services column -->
<rect x="1190" y="180" width="215" height="92" rx="5" fill="#FDF0F7" stroke="#E7157B" stroke-width="1.5"/>
<text x="1297" y="203" font-size="12" font-weight="bold" text-anchor="middle" fill="#E7157B">AWS Secrets Manager</text>
<text x="1297" y="223" font-size="11" text-anchor="middle" fill="#16191F">Secret: Mydbsecret</text>
<text x="1297" y="240" font-size="10" text-anchor="middle" fill="#5A6570">user · password · host · db</text>
<text x="1297" y="258" font-size="10" text-anchor="middle" fill="#5A6570">read at runtime via LabRole</text>

<rect x="1190" y="292" width="215" height="86" rx="5" fill="#F4F8EE" stroke="#759C3E" stroke-width="1.5"/>
<text x="1297" y="315" font-size="12" font-weight="bold" text-anchor="middle" fill="#759C3E">Amazon CloudWatch</text>
<text x="1297" y="334" font-size="10" text-anchor="middle" fill="#5A6570">Metrics: CPU, request count,</text>
<text x="1297" y="349" font-size="10" text-anchor="middle" fill="#5A6570">target response time</text>
<text x="1297" y="367" font-size="10" text-anchor="middle" fill="#5A6570">Logs: /vpc/asm-flowlogs</text>

<rect x="1190" y="398" width="215" height="70" rx="5" fill="#F7F7F8" stroke="#879196" stroke-width="1.5"/>
<text x="1297" y="420" font-size="12" font-weight="bold" text-anchor="middle" fill="#5A6570">IAM</text>
<text x="1297" y="439" font-size="10" text-anchor="middle" fill="#5A6570">LabInstanceProfile → LabRole</text>
<text x="1297" y="456" font-size="10" text-anchor="middle" fill="#5A6570">grants secretsmanager:GetSecretValue</text>

<!-- VPC -->
<rect x="243" y="150" width="925" height="800" rx="6" fill="#FBF9FF" stroke="#8C4FFF" stroke-width="2"/>
<text x="259" y="171" font-size="12.5" font-weight="bold" fill="#8C4FFF">VPC  asm-VPC  ·  10.0.0.0/16  ·  DNS hostnames enabled</text>

<!-- IGW -->
<rect x="255" y="186" width="120" height="42" rx="4" fill="#F3ECFF" stroke="#8C4FFF" stroke-width="1.5"/>
<text x="315" y="203" font-size="11" font-weight="bold" text-anchor="middle" fill="#8C4FFF">asm-IGW</text>
<text x="315" y="219" font-size="10" text-anchor="middle" fill="#5A6570">Internet gateway</text>

<!-- edge protection -->
<rect x="395" y="186" width="130" height="42" rx="4" fill="#FDF0F7" stroke="#E7157B" stroke-width="1.4"/>
<text x="460" y="203" font-size="11" font-weight="bold" text-anchor="middle" fill="#E7157B">Shield Standard</text>
<text x="460" y="219" font-size="9.5" text-anchor="middle" fill="#5A6570">automatic on the ALB</text>
<rect x="537" y="186" width="130" height="42" rx="4" fill="#fff" stroke="#E7157B" stroke-width="1.4" stroke-dasharray="5 3"/>
<text x="602" y="203" font-size="11" font-weight="bold" text-anchor="middle" fill="#E7157B">AWS WAF</text>
<text x="602" y="219" font-size="9.5" text-anchor="middle" fill="#5A6570">designed, not deployed</text>

<!-- AZ columns -->
<rect x="262" y="246" width="432" height="686" rx="5" fill="none" stroke="#0073BB" stroke-width="1.5" stroke-dasharray="6 3"/>
<text x="478" y="266" font-size="12" font-weight="bold" text-anchor="middle" fill="#0073BB">Availability Zone  us-east-1a</text>
<rect x="716" y="246" width="432" height="686" rx="5" fill="none" stroke="#0073BB" stroke-width="1.5" stroke-dasharray="6 3"/>
<text x="932" y="266" font-size="12" font-weight="bold" text-anchor="middle" fill="#0073BB">Availability Zone  us-east-1b</text>

<!-- PUBLIC TIER -->
<rect x="278" y="280" width="400" height="196" rx="4" fill="#F0F7EE" stroke="#7AA116" stroke-width="1.5"/>
<text x="292" y="300" font-size="11.5" font-weight="bold" fill="#5C7A10">Public subnet  asm-Public-A  ·  10.0.0.0/24</text>
<text x="292" y="316" font-size="10" fill="#7A8A5A">route table asm-RT-Public  →  0.0.0.0/0 via asm-IGW</text>
<rect x="732" y="280" width="400" height="196" rx="4" fill="#F0F7EE" stroke="#7AA116" stroke-width="1.5"/>
<text x="746" y="300" font-size="11.5" font-weight="bold" fill="#5C7A10">Public subnet  asm-Public-B  ·  10.0.1.0/24</text>
<text x="746" y="316" font-size="10" fill="#7A8A5A">route table asm-RT-Public  →  0.0.0.0/0 via asm-IGW</text>

<!-- ALB spanning -->
<rect x="300" y="330" width="810" height="56" rx="5" fill="#F3ECFF" stroke="#8C4FFF" stroke-width="2"/>
<text x="705" y="352" font-size="13" font-weight="bold" text-anchor="middle" fill="#8C4FFF">asm-ALB  ·  Application Load Balancer  (internet-facing)</text>
<text x="705" y="372" font-size="10.5" text-anchor="middle" fill="#5A6570">HTTP:80 listener → target group App-TG · health check / · nodes in both Availability Zones · ALB-SG</text>

<!-- NAT + Cloud9 -->
<rect x="300" y="400" width="180" height="60" rx="4" fill="#F3ECFF" stroke="#8C4FFF" stroke-width="1.5"/>
<text x="390" y="421" font-size="11" font-weight="bold" text-anchor="middle" fill="#8C4FFF">asm-NAT</text>
<text x="390" y="437" font-size="9.5" text-anchor="middle" fill="#5A6570">NAT gateway</text>
<text x="390" y="452" font-size="9.5" text-anchor="middle" fill="#5A6570">EIP 52.73.159.122</text>

<rect x="496" y="400" width="170" height="60" rx="4" fill="#FEF4EC" stroke="#ED7100" stroke-width="1.5"/>
<text x="581" y="421" font-size="11" font-weight="bold" text-anchor="middle" fill="#ED7100">asm-Cloud9</text>
<text x="581" y="437" font-size="9.5" text-anchor="middle" fill="#5A6570">t3.micro · SSH</text>
<text x="581" y="452" font-size="9.5" text-anchor="middle" fill="#5A6570">admin + load testing</text>

<text x="932" y="432" font-size="10.5" text-anchor="middle" fill="#7A8A5A">(load balancer node only)</text>

<!-- APP TIER -->
<rect x="278" y="502" width="400" height="196" rx="4" fill="#FEF4EC" stroke="#ED7100" stroke-width="1.5"/>
<text x="292" y="522" font-size="11.5" font-weight="bold" fill="#B35700">Private subnet  asm-App-A  ·  10.0.2.0/24</text>
<text x="292" y="538" font-size="10" fill="#A08060">route table asm-RT-App  →  0.0.0.0/0 via asm-NAT  (outbound only)</text>
<rect x="732" y="502" width="400" height="196" rx="4" fill="#FEF4EC" stroke="#ED7100" stroke-width="1.5"/>
<text x="746" y="522" font-size="11.5" font-weight="bold" fill="#B35700">Private subnet  asm-App-B  ·  10.0.3.0/24</text>
<text x="746" y="538" font-size="10" fill="#A08060">route table asm-RT-App  →  0.0.0.0/0 via asm-NAT  (outbound only)</text>

<rect x="300" y="556" width="810" height="122" rx="5" fill="none" stroke="#ED7100" stroke-width="2" stroke-dasharray="7 4"/>
<text x="705" y="576" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#B35700">Auto Scaling group  App-ASG  ·  min 2 / desired 2 / max 4</text>
<text x="705" y="593" font-size="10" text-anchor="middle" fill="#A08060">launch template App-LT-v1 · AMI App-Server-AMI-v1 · target tracking on average CPU 50% · warm-up 300s</text>

<rect x="330" y="606" width="150" height="58" rx="4" fill="#fff" stroke="#ED7100" stroke-width="1.5"/>
<text x="405" y="626" font-size="11" font-weight="bold" text-anchor="middle" fill="#ED7100">EC2  t3.micro</text>
<text x="405" y="642" font-size="9.5" text-anchor="middle" fill="#5A6570">Node.js app · port 80</text>
<text x="405" y="656" font-size="9.5" text-anchor="middle" fill="#5A6570">App-SG · LabInstanceProfile</text>

<rect x="784" y="606" width="150" height="58" rx="4" fill="#fff" stroke="#ED7100" stroke-width="1.5"/>
<text x="859" y="626" font-size="11" font-weight="bold" text-anchor="middle" fill="#ED7100">EC2  t3.micro</text>
<text x="859" y="642" font-size="9.5" text-anchor="middle" fill="#5A6570">Node.js app · port 80</text>
<text x="859" y="656" font-size="9.5" text-anchor="middle" fill="#5A6570">App-SG · LabInstanceProfile</text>

<!-- DB TIER -->
<rect x="278" y="724" width="400" height="186" rx="4" fill="#E9F7F5" stroke="#01A88D" stroke-width="1.5"/>
<text x="292" y="744" font-size="11.5" font-weight="bold" fill="#017A66">Private subnet  asm-DB-A  ·  10.0.4.0/24</text>
<text x="292" y="760" font-size="10" fill="#5F9188">route table asm-RT-DB  —  local route only, no path to the internet</text>
<rect x="732" y="724" width="400" height="186" rx="4" fill="#E9F7F5" stroke="#01A88D" stroke-width="1.5"/>
<text x="746" y="744" font-size="11.5" font-weight="bold" fill="#017A66">Private subnet  asm-DB-B  ·  10.0.5.0/24</text>
<text x="746" y="760" font-size="10" fill="#5F9188">route table asm-RT-DB  —  local route only, no path to the internet</text>

<rect x="300" y="778" width="356" height="78" rx="5" fill="#fff" stroke="#01A88D" stroke-width="2"/>
<text x="478" y="800" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#01A88D">asm-rds  ·  Amazon RDS for MySQL</text>
<text x="478" y="818" font-size="10" text-anchor="middle" fill="#5A6570">db.t3.micro · 20 GiB gp3 · Single-AZ · Publicly accessible: No</text>
<text x="478" y="834" font-size="10" text-anchor="middle" fill="#5A6570">database STUDENTS · automated backups, 7-day retention · DB-SG</text>
<text x="478" y="849" font-size="9.5" text-anchor="middle" fill="#C7442E">single point of failure — Multi-AZ named as the production enhancement</text>

<rect x="754" y="778" width="356" height="78" rx="5" fill="#fff" stroke="#01A88D" stroke-width="1.4" stroke-dasharray="6 4"/>
<text x="932" y="806" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#5F9188">no database instance in this zone</text>
<text x="932" y="826" font-size="10" text-anchor="middle" fill="#5A6570">subnet exists because RDS requires a DB subnet</text>
<text x="932" y="842" font-size="10" text-anchor="middle" fill="#5A6570">group spanning two Availability Zones</text>

<!-- DB subnet group bracket -->
<rect x="288" y="768" width="832" height="98" rx="4" fill="none" stroke="#01A88D" stroke-width="1.2" stroke-dasharray="3 3"/>
<text x="704" y="880" font-size="10.5" text-anchor="middle" fill="#017A66">DB subnet group  asm-db-subnet-group  (spans us-east-1a and us-east-1b)</text>

<!-- ============ CONNECTIONS ============ -->
<!-- users to IGW -->
<line x1="182" y1="119" x2="315" y2="184" stroke="#4A5568" stroke-width="2" marker-end="url(#a)"/>
<text x="196" y="152" font-size="10" fill="#4A5568">HTTP 80</text>
<!-- IGW down to ALB -->
<line x1="315" y1="230" x2="315" y2="328" stroke="#4A5568" stroke-width="2" marker-end="url(#a)"/>
<!-- ALB to app A -->
<line x1="405" y1="388" x2="405" y2="604" stroke="#4A5568" stroke-width="2" marker-end="url(#a)"/>
<text x="414" y="478" font-size="10" fill="#4A5568">HTTP 80</text>
<text x="414" y="492" font-size="9.5" fill="#8A94A0">App-SG accepts ALB-SG only</text>
<!-- ALB to app B -->
<line x1="859" y1="388" x2="859" y2="604" stroke="#4A5568" stroke-width="2" marker-end="url(#a)"/>
<text x="868" y="478" font-size="10" fill="#4A5568">HTTP 80</text>
<!-- app A to RDS -->
<line x1="405" y1="666" x2="405" y2="776" stroke="#01A88D" stroke-width="2" marker-end="url(#a)"/>
<text x="412" y="712" font-size="10" fill="#017A66">TCP 3306</text>
<text x="412" y="726" font-size="9.5" fill="#5F9188">DB-SG accepts App-SG only</text>
<!-- app B to RDS -->
<path d="M784,650 L706,650 L706,712 L520,712 L520,776" fill="none" stroke="#01A88D" stroke-width="2" marker-end="url(#a)"/>
<text x="612" y="708" font-size="10" fill="#017A66">TCP 3306 (cross-AZ)</text>
<!-- app A outbound to NAT -->
<path d="M330,620 L300,620 L300,470 L360,470 L360,462" fill="none" stroke="#ED7100" stroke-width="2" marker-end="url(#ao)"/>
<!-- NAT up to IGW -->
<path d="M340,398 L340,250 L300,250 L300,230" fill="none" stroke="#ED7100" stroke-width="2" marker-end="url(#ao)"/>
<!-- IGW out to Secrets Manager -->
<path d="M375,196 L1180,196 L1180,214" fill="none" stroke="#ED7100" stroke-width="2" marker-end="url(#ao)"/>
<text x="770" y="190" font-size="10" fill="#ED7100">GetSecretValue via LabRole — no credential stored on the instance or in the AMI</text>
<!-- Cloud9 to RDS -->
<path d="M581,462 L581,490 L640,490 L640,776" fill="none" stroke="#8A94A0" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#a)"/>
<text x="648" y="742" font-size="9.5" fill="#8A94A0">3306 · migration</text>
<!-- flow logs / metrics to CloudWatch -->
<path d="M1132,464 L1180,464 L1180,352 L1186,352" fill="none" stroke="#759C3E" stroke-width="1.8" marker-end="url(#ag)"/>
<text x="1126" y="460" font-size="10" text-anchor="end" fill="#759C3E">scaling metrics and VPC flow logs</text>

<!-- legend -->
<rect x="30" y="700" width="196" height="250" rx="5" fill="#FAFAFA" stroke="#C7CDD3" stroke-width="1"/>
<text x="44" y="722" font-size="11.5" font-weight="bold" fill="#16191F">How the requirements are met</text>
<text x="44" y="746" font-size="10" font-weight="bold" fill="#4A5568">Highly available</text>
<text x="44" y="760" font-size="9.5" fill="#5A6570">Every tier in two AZs;</text>
<text x="44" y="773" font-size="9.5" fill="#5A6570">ALB health checks replace</text>
<text x="44" y="786" font-size="9.5" fill="#5A6570">failed instances automatically</text>
<text x="44" y="808" font-size="10" font-weight="bold" fill="#4A5568">Scalable</text>
<text x="44" y="822" font-size="9.5" fill="#5A6570">Target tracking adds capacity</text>
<text x="44" y="835" font-size="9.5" fill="#5A6570">as average CPU rises past 50%</text>
<text x="44" y="857" font-size="10" font-weight="bold" fill="#4A5568">Secure</text>
<text x="44" y="871" font-size="9.5" fill="#5A6570">Database has no internet route;</text>
<text x="44" y="884" font-size="9.5" fill="#5A6570">each tier accepts only the tier</text>
<text x="44" y="897" font-size="9.5" fill="#5A6570">in front of it; no stored password</text>
<text x="44" y="919" font-size="10" font-weight="bold" fill="#4A5568">Cost optimised</text>
<text x="44" y="933" font-size="9.5" fill="#5A6570">Burstable instances, one NAT,</text>
<text x="44" y="946" font-size="9.5" fill="#5A6570">ASG minimum set for resilience</text>

<text x="30" y="988" font-size="9.5" fill="#8A94A0">Build-SG, the temporary group used to reach instances during construction, was deleted after the build and is not part of the delivered architecture.</text>
</svg>
